[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sales-mobile-ingest"
version = "0.1.0"
description = "Read-only Windows MTP call-recording ingestion with a stable recording contract"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/sales_mobile_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
