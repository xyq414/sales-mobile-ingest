[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sales-mobile-ingest"
version = "0.1.0"
description = "Read-only Windows MTP call-recording ingestion with a stable recording contract"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
desktop = ["PySide6>=6.9.3,<6.10"]
build = ["PyInstaller>=6.11,<7"]

[project.scripts]
sales-mobile-ingest = "sales_mobile_ingest.cli:main"
sales-mobile-ingest-desktop = "sales_mobile_ingest.desktop_entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_mobile_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
